# Envoie automatiquement le site sur l'hébergement par FTP à chaque modification de la branche main.
# Secrets à créer dans GitHub : Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER     ex. ftp.yabisocloud.com (fourni par l'hébergeur)
#   FTP_USERNAME   identifiant FTP
#   FTP_PASSWORD   mot de passe FTP
#   FTP_SERVER_DIR (facultatif) dossier du site sur le serveur, par défaut public_html/  (OVH : www/)
name: Déploiement FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-ftp

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Envoyer les fichiers par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
